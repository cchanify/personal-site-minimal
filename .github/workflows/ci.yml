name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 14 * * 1' # Mondays: catch link rot
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/dist"
            --accept 200,206,403,429
            --max-retries 2
            --timeout 20
            --exclude linkedin.com
            'dist/**/*.html'
